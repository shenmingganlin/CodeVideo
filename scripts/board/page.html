<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>分镜评审</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <header id="bar">
      <div class="bar-title"><span id="title">分镜评审</span> <span id="round" class="chip"></span></div>
      <div class="bar-right">
        <span id="offline" hidden>服务器断开了，重新运行 npm run board 后会自动接上</span>
        <span id="open-count"></span>
        <span id="approved"></span>
        <button id="approve" type="button">这一轮定稿</button>
      </div>
    </header>
    <section id="approve-panel" hidden>
      <div><b>定稿 <span id="approve-round"></span></b>：照现在这一版做样片和成片。</div>
      <div id="approve-warn" hidden></div>
      <textarea id="approve-note" placeholder="想补一句话可以写在这里，不写也行"></textarea>
      <div id="approve-error" hidden></div>
      <div class="approve-actions">
        <button id="approve-cancel" type="button">先不定</button>
        <button id="approve-ok" class="primary" type="button">确定定稿</button>
      </div>
    </section>
    <div id="banner" hidden></div>
    <nav id="strip"></nav>
    <main id="main"><p class="hint">加载中…</p></main>
    <div id="toast" hidden></div>
    <script src="/page.js"></script>
  </body>
</html>
